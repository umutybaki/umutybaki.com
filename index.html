<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umut Yalçın Baki</title>
    <meta name="description"
        content="Umut Yalçın Baki – Software Engineer & Computer Engineering/Economics double major at Koç University.">

    <!-- Google Fonts: Inter and Roboto Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <style>
        html, body {
            overflow: hidden;
            height: 100%;
        }

        .home-hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: calc(100vh - 70px);
        }

        .home-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .home-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.25rem;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            color: var(--text-primary);
            font-weight: 500;
            font-size: 1rem;
            transition: all var(--transition-fast);
            text-decoration: none;
        }

        .home-link svg {
            color: var(--accent-color);
        }

        .home-link:hover {
            background: var(--surface-hover);
            transform: translateY(-2px);
            border-color: rgba(2, 132, 199, 0.3);
            opacity: 1;
        }

        .home-tagline {
            font-size: 1.125rem;
            color: var(--accent-color);
            font-weight: 500;
            margin-bottom: 1rem;
            font-family: var(--font-mono);
        }

        .home-bio {
            font-size: 1.125rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <!-- Background Canvas for Constellations -->
    <canvas id="bg-canvas"></canvas>

    <div class="glow-overlay"></div>

    <nav class="main-nav">
        <div class="nav-content">
            <div class="nav-name">Umut Yalçın Baki</div>
            <div class="header-controls" style="display: flex; gap: 1rem; align-items: center;">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button id="lang-toggle" class="lang-toggle" aria-label="Toggle Language">
                    <div class="lang-slider"></div>
                    <span class="lang-label en">EN</span>
                    <span class="lang-label tr">TR</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="home-hero reveal active">
            <h1 class="hero-name">Umut Yalçın Baki</h1>
            <p class="home-tagline">
                <span class="lang-en">Koç University - Computer Engineering & Economics DM</span>
                <span class="lang-tr">Koç Üniversitesi - Bilgisayar Mühendisliği & Ekonomi ÇAP</span>
            </p>
            <p class="home-bio">
                <span class="lang-en">Computer Engineering & Economics double major. I like building things that make sense.</span>
                <span class="lang-tr">Bilgisayar Mühendisliği & Ekonomi ÇAP öğrencisi.</span>
            </p>

            <div class="home-links">
                <a href="https://github.com/umutybaki" target="_blank" rel="noopener noreferrer" class="home-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
                        </path>
                    </svg>
                    GitHub
                </a>
                <a href="https://www.linkedin.com/in/umutybaki" target="_blank" rel="noopener noreferrer"
                    class="home-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                        <rect x="2" y="9" width="4" height="12"></rect>
                        <circle cx="4" cy="4" r="2"></circle>
                    </svg>
                    LinkedIn
                </a>

            </div>
        </section>
    </main>

    <!-- Script -->
    <script src="script.js"></script>
</body>

</html>
